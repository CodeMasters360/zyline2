name: Android Upstream Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.0
      GOFLAGS: -buildvcs=false

    steps:
      # Step 1: Checkout directly from the upstream repository
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: 'ajavadinezhad/zyrln'
          ref: 'main'

      # Step 2: Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      # Step 3: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step 4: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          for i in 1 2 3; do
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;26.1.10909125" && exit 0
            echo "sdkmanager install failed (attempt $i/3), retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      # Step 5: Install Gomobile and build Go mobile AAR
      - name: Install gomobile
        run: |
          mobile_version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${mobile_version}"
          go install "golang.org/x/mobile/cmd/gobind@${mobile_version}"

      - name: Build Go mobile library (AAR)
        run: make android

      # Step 6: Build Android APKs (Debug & Release)
      - name: Build Android APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      # Step 7: Auto-generate keystore and sign the Release APK
      - name: Sign Release APK
        run: |
          keytool -genkeypair -v -keystore release.jks -alias androidRelease -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Zyrln, OU=App, O=AutoBuild, L=Unknown, S=Unknown, C=US"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks release.jks --ks-key-alias androidRelease --ks-pass pass:123456 --key-pass pass:123456 --out android/app/build/outputs/apk/release/app-release-signed.apk "$RELEASE_APK"
            echo "Release APK signed successfully."
          else
            echo "Release APK not found to sign!"
          fi

      # Step 8: Generate dynamic Tag name
      - name: Generate Tag Name
        id: tag
        run: echo "TAG_NAME=build-$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      # Step 9: Create GitHub Release and upload APKs
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Auto Build ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
